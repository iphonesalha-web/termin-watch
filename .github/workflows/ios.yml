name: Build iOS IPA

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project TerminPi.xcodeproj -target TerminPi \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log || true
          test -d build/Release-iphoneos/TerminPi.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/TerminPi.app Payload/
          zip -qry TerminPi.ipa Payload
          ls -lh TerminPi.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-v1.0.${{ github.run_number }}" TerminPi.ipa \
            --title "Termin Pi (iOS) v1.0.${{ github.run_number }}" \
            --notes "ملف IPA غير موقّع — وقّعه بشهادتك في ESign ثم ثبّته." \
            --repo "${{ github.repository }}"
